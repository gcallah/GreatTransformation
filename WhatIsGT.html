    </figure>

    </figure>

    </figure>

    </figure>
    <figure id="slide-21">
      <img src="WhatIsGT/slide-21.jpg" width="1200" height="900" alt="The Rise of Economics. Adam Smith and other social theorists sought to establish economics as a new science explaining the new conditions. Others, like Marx, dismissed the classical economists as apologists for exploitation." loading="lazy">
      <figcaption><a href="#slide-21">21</a></figcaption>
    </figure>
    <figure id="slide-22">
      <img src="WhatIsGT/slide-22.jpg" width="1200" height="900" alt="Output Soared. For the first time in history, part of the world saw sustained economic growth." loading="lazy">
      <figcaption><a href="#slide-22">22</a></figcaption>
    </figure>
    <figure id="slide-23">
      <img src="WhatIsGT/slide-23.jpg" width="1200" height="900" alt="The Backlash Against Industrialism. But was the new wealth being shared justly? And did it justify the conditions found in industrial society?" loading="lazy">
      <figcaption><a href="#slide-23">23</a></figcaption>
    </figure>
    <figure id="slide-24">
      <img src="WhatIsGT/slide-24.jpg" width="1200" height="900" alt="The Rise of Socialism. Did not question the value of mass production. But held that democratic control of production would “rationalize” the economy." loading="lazy">
      <figcaption><a href="#slide-24">24</a></figcaption>
    </figure>

      <img src="WhatIsGT/slide-25.jpg" width="1200" height="900" alt="World War I: A Crisis for Liberalism. Liberal society was supposed to promise an ever-better social world. The massive destruction and brutality of this war threw that promise into doubt." loading="lazy">
      <figcaption><a href="#slide-25">25</a></figcaption>
    </figure>
    <figure id="slide-26">
      <img src="WhatIsGT/slide-26.jpg" width="1200" height="900" alt="The Great Depression. A second crisis for liberalism. Is capitalism inherently unstable? To what extent can the government “fix” and downturn?" loading="lazy">

    </figure>

    </figure>
