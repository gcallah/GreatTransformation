    <h1>Karl Marx</h1>

  <main>
    <figure id="slide-1">
      <img src="Marx/slide-01.jpg" width="1200" height="900" alt="Karl Marx. 1818-1883. Born in Trier, Prussia. Died in London, England. Major works: The Poverty of Philosophy. The Communist Manifesto. Capital (Three Volumes)">
      <figcaption><a href="#slide-1">1</a></figcaption>
    </figure>
    <figure id="slide-2">
      <img src="Marx/slide-02.jpg" width="1200" height="900" alt="Friedrich Engels. 1820-1895. Born in Barmen, Prussia. Died in London, England. His family were wealthy factory owners. He was Marx’s financial patron. All of Marx’s works were, in some sense, a collaboration with Engels" loading="lazy">
      <figcaption><a href="#slide-2">2</a></figcaption>
    </figure>
    <figure id="slide-3">
      <img src="Marx/slide-03.jpg" width="1200" height="900" alt="GWF Hegel. 1770-1831. Born in Stuttgart, Württemberg. Died in Berlin, Prussia. Developed dialectical theory. Philosophical Idealist. Deeply influential in Germany of 1800s" loading="lazy">
      <figcaption><a href="#slide-3">3</a></figcaption>
    </figure>
    <figure id="slide-4">
      <img src="Marx/slide-04.jpg" width="1200" height="900" alt="Dialectics. Just as an acorn becomes… an oak tree through internal forces." loading="lazy">
      <figcaption><a href="#slide-4">4</a></figcaption>
    </figure>
    <figure id="slide-5">
      <img src="Marx/slide-05.jpg" width="1200" height="900" alt="Dialectics. Just as a tadpole becomes… a frog through internal forces." loading="lazy">
      <figcaption><a href="#slide-5">5</a></figcaption>
    </figure>
    <figure id="slide-6">
      <img src="Marx/slide-06.jpg" width="1200" height="900" alt="Dialectics. So feudalism becomes… capitalism through internal forces." loading="lazy">
      <figcaption><a href="#slide-6">6</a></figcaption>
    </figure>
    <figure id="slide-7">
      <img src="Marx/slide-07.jpg" width="1200" height="900" alt="Materialism. But Hegel was “standing on his head.” He saw physical world as based on ideas: “the real is the rational.” Marx and Engels believed they had to set him right side up. Ideas based on physical world: politics, religion, and philosophy are a superstructure built on economics." loading="lazy">
      <figcaption><a href="#slide-7">7</a></figcaption>
    </figure>
    <figure id="slide-8">
      <img src="Marx/slide-08.jpg" width="1200" height="900" alt="Democritus: Early Materialist. Taught that the world was made of atoms. No immortal soul. The subject of Marx’s doctoral dissertation" loading="lazy">
      <figcaption><a href="#slide-8">8</a></figcaption>
    </figure>
    <figure id="slide-9">
      <img src="Marx/slide-09.jpg" width="1200" height="900" alt="Ludwig Feurbach: Alienation. Student of Hegel. “Religion, at least the Christian religion, is the expression of how man relates to himself, or more correctly, to his essential being; but he relates to his essential being as to another being. The Divine Being is nothing other than the being of man himself, or rather, the being of man abstracted from the limits of the individual man or the real, corporeal man, and objectified, i.e., contemplated and worshiped as another being, as a being distinguished from his own. All determinations of the Divine Being are, therefore, determinations of the being of man.” -- Essence of Christianity" loading="lazy">
      <figcaption><a href="#slide-9">9</a></figcaption>
    </figure>
    <figure id="slide-10">
      <img src="Marx/slide-10.jpg" width="1200" height="900" alt="But Dialectical Materialism Is Not Deterministic. “The materialist doctrine that men are products of circumstances and upbringing, and that, therefore, changed men are products of other circumstances, forgets that it is men that change circumstances, and that the educator himself needs educating.” – “Theses on Feurbach”" loading="lazy">
      <figcaption><a href="#slide-10">10</a></figcaption>
    </figure>
    <figure id="slide-11">
      <img src="Marx/slide-11.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Primitive Communism: as in co-operative tribal societies." loading="lazy">
      <figcaption><a href="#slide-11">11</a></figcaption>
    </figure>
    <figure id="slide-12">
      <img src="Marx/slide-12.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Slave Society: a development of tribal progression to city-state; Aristocracy is born." loading="lazy">
      <figcaption><a href="#slide-12">12</a></figcaption>
    </figure>
    <figure id="slide-13">
      <img src="Marx/slide-13.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Feudalism: aristocrats are the ruling class; merchants evolve into capitalists." loading="lazy">
      <figcaption><a href="#slide-13">13</a></figcaption>
    </figure>
    <figure id="slide-14">
      <img src="Marx/slide-14.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Capitalism: capitalists are the ruling class, who create and employ the proletariat." loading="lazy">
      <figcaption><a href="#slide-14">14</a></figcaption>
    </figure>
    <figure id="slide-15">
      <img src="Marx/slide-15.jpg" width="1200" height="900" alt="Marx on Predicting What Was Coming. Marx did not wish “to write recipes for the cook-shops of the future.” As someone going through this dialectical process himself, he was modest enough to admit he could not see everything that was coming. Therefore, Marxist descriptions of the next two phases, socialism and communism, are somewhat vague." loading="lazy">
      <figcaption><a href="#slide-15">15</a></figcaption>
    </figure>
    <figure id="slide-16">
      <img src="Marx/slide-16.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Socialism: workers gain class consciousness, and via proletarian revolution depose the capitalist dictatorship of the bourgeoisie, replacing it in turn with dictatorship of the proletariat through which the socialization of the means of production can be realized." loading="lazy">
      <figcaption><a href="#slide-16">16</a></figcaption>
    </figure>
    <figure id="slide-17">
      <img src="Marx/slide-17.jpg" width="1200" height="900" alt="Marx’s Historical Progression of Social Structures. Communism: a classless and stateless society. (Source: Wikipedia)" loading="lazy">
      <figcaption><a href="#slide-17">17</a></figcaption>
    </figure>
    <figure id="slide-18">
      <img src="Marx/slide-18.jpg" width="1200" height="900" alt="Class Structure. Jon Elster on Marx’s Class Schema. (Source: Wikipedia)" loading="lazy">
      <figcaption><a href="#slide-18">18</a></figcaption>
    </figure>
    <figure id="slide-19">
      <img src="Marx/slide-19.jpg" width="1200" height="900" alt="The Economic Structure of Society. Economic relations are relations among people, not among things: “In the social production which men carry on they enter into definite relations that are indispensable and independent of their will… The sum total of these relations of production constitutes the economic structure of society, on which rise legal and political superstructures and to which correspond definite forms of social consciousness.” – Critique of Political Economy" loading="lazy">
      <figcaption><a href="#slide-19">19</a></figcaption>
    </figure>
    <figure id="slide-20">
      <img src="Marx/slide-20.jpg" width="1200" height="900" alt="The Economic Structure of Society. This theory of economic stages is not economic determinism: “once an historic element has been brought into the world by other elements, ultimately by economic facts, it also reacts in its turn and may react on its environment and even on its own causes… Marx and I are ourselves partly to blame for the fact that younger writers sometimes lay more stress on the economic side than is due it. We had to emphasize this main principle in opposition to our adversaries, who denied it…” – Engels from Selected Correspondence" loading="lazy">
      <figcaption><a href="#slide-20">20</a></figcaption>
    </figure>
    <figure id="slide-21">
      <img src="Marx/slide-21.jpg" width="1200" height="900" alt="Capitalism. Under feudalism, the peasants knew when they were working for the lord and when they were free." loading="lazy">
      <figcaption><a href="#slide-21">21</a></figcaption>
    </figure>
    <figure id="slide-22">
      <img src="Marx/slide-22.jpg" width="1200" height="900" alt="Capitalism. But the unique feature of capitalism, according to Marx, is that it creates the appearance of free labor by those who are really wage slaves." loading="lazy">
      <figcaption><a href="#slide-22">22</a></figcaption>
    </figure>
    <figure id="slide-23">
      <img src="Marx/slide-23.jpg" width="1200" height="900" alt="Capitalism. But Marx and Engels admired capitalism in what they saw as its historical role: “The bourgeoisie, during its rule of scarce one hundred years, has created more massive and more colossal productive forces than have all preceding generations together.” – The Communist Manifesto. “Marx… stresses the bad sides of [capitalism] but with equal emphasis… proves [capitalism] was necessary to develop the productive forces of a society to a level which will make possible an equal development worthy of human beings for all members of society.” – Engels review of Capital" loading="lazy">
      <figcaption><a href="#slide-23">23</a></figcaption>
    </figure>
    <figure id="slide-24">
      <img src="Marx/slide-24.jpg" width="1200" height="900" alt="Capitalism. And they understood the market process: ‘Continual deviations of the prices of commodities from their values are the necessary condition in and through which the value of the commodities as such can come into existence. Only through the fluctuations of competition, and consequently of commodity prices, does the law of value of commodity production assert itself and the determination of the value of the commodity… become a reality. To desire, in a society of producers who exchange their commodities, to establish the determination of value by labour time, by forbidding competition to establish this determination of value through pressure on prices in the only way it can be established, is therefore merely to prove that, at least in this sphere, one has adopted the usual utopian disdain of economic laws… competition, by bringing into operation the law of value of commodity production in a society of producers who exchange their commodities, precisely thereby brings about the only organisation and arrangement of social production which is possible in the circumstances. Only through the undervaluation or overvaluation of products is it forcibly brought home to the individual commodity producers what society requires or does not require and in what amounts. But it is precisely this sole regulator that the utopia[n]… wishes to abolish. And if we then ask what guarantee we have that necessary quantity and not more of each product will be produced, that we shall not go hungry in regard to corn and meat while we are choked in beet sugar and drowned in potato spirit, that we shall not lack trousers to cover our nakedness while trouser buttons flood us by the million [the utopian] triumphantly shows us his splendid calculation, according to which the correct certificate has been handed out for every superfluous pound of sugar, for every unsold barrel of spirit, for every unusable trouser button, a calculation which “works out” exactly, and according to which “all claims will be satisfied and the liquidation correctly brought about”.’" loading="lazy">
      <figcaption><a href="#slide-24">24</a></figcaption>
    </figure>
    <figure id="slide-25">
      <img src="Marx/slide-25.jpg" width="1200" height="900" alt="Economic Crises. A series of financial crises will bring down capitalism. Crises are inherent in capitalism because producers cannot predict the demand of consumers and the supply of other producers. As capitalism spreads, these crises become more widespread" loading="lazy">
      <figcaption><a href="#slide-25">25</a></figcaption>
    </figure>
    <figure id="slide-26">
      <img src="Marx/slide-26.jpg" width="1200" height="900" alt="Value. Value is defined as the amount of socially necessary labor that was needed to produce something. Price does not equal value, even under socialism." loading="lazy">
      <figcaption><a href="#slide-26">26</a></figcaption>
    </figure>
    <figure id="slide-27">
      <img src="Marx/slide-27.jpg" width="1200" height="900" alt="Surplus Value. The worker produces a final product, but the capitalist only pays for his ‘labor power.’ The difference between the two Marx calls ‘capitalist exploitation.’" loading="lazy">
      <figcaption><a href="#slide-27">27</a></figcaption>
    </figure>
    <figure id="slide-28">
      <img src="Marx/slide-28.jpg" width="1200" height="900" alt="Surplus Value. Marx and Engels did not neglect the value of capital. It was the person, the capitalist, whom they thought was dispensable. They believed that capital embodied the value of the past labor that built it. Therefore, under communism the worker still would not receive the full value of what he produces; some portion would still need to be re-invested in equipment, infrastructure, and so on. They ridiculed the idea of paying for work time as utopian." loading="lazy">
      <figcaption><a href="#slide-28">28</a></figcaption>
    </figure>
    <figure id="slide-29">
      <img src="Marx/slide-29.jpg" width="1200" height="900" alt="Surplus Value. In short, it is not the return to capital that Marx questions, but the return to the capitalist." loading="lazy">
      <figcaption><a href="#slide-29">29</a></figcaption>
    </figure>
    <figure id="slide-30">
      <img src="Marx/slide-30.jpg" width="1200" height="900" alt="Surplus Value. Surplus value is not necessarily equal to profit for any particular firm. (c = fixed capital, v = variable capital, and s = surplus; source: Thomas Sowell, Marxism)" loading="lazy">
      <figcaption><a href="#slide-30">30</a></figcaption>
    </figure>
    <figure id="slide-31">
      <img src="Marx/slide-31.jpg" width="1200" height="900" alt="The Increasing Misery of the Proletariat. Marx shared with Ricardo a unique definition of the wage rate: it is the amount of labor a given wage can buy. Therefore, workers can be making more in terms of purchasing power, but suffer ‘falling wages,’ if there wage falls relative to others. “If capital is growing rapidly, wages may rise: the profit of capital rises incomparably more rapidly. The material position of the worker has improved, but at the cost of his social position.” – “Wage Labour and Capital”" loading="lazy">
      <figcaption><a href="#slide-31">31</a></figcaption>
    </figure>
    <figure id="slide-32">
      <img src="Marx/slide-32.jpg" width="1200" height="900" alt="Alienation from Work. Repetitive and mindless tasks on assembly line made worker “a crippled monstrosity.” Adam Smith worried about this aspect of the division of labor as well." loading="lazy">
      <figcaption><a href="#slide-32">32</a></figcaption>
    </figure>
    <figure id="slide-33">
      <img src="Marx/slide-33.jpg" width="1200" height="900" alt="Politics and Revolution. What would the “dictatorship of the proletariat” look like? Universal suffrage. An open society. Freedom of religion and separation of church and state. Non-militarism. Marx and Engels thought that peaceful, democratic revolution was possible. They disdained conspiratorial revolutions led by small cadres." loading="lazy">
      <figcaption><a href="#slide-33">33</a></figcaption>
    </figure>
    <figure id="slide-34">
      <img src="Marx/slide-34.jpg" width="1200" height="900" alt="What Is Wrong? That all value arises from labor is merely asserted – no evidence is given. In fact, entrepreneurial judgment is a major component of economic performance. Marxism is a glorious structure erected on a foundation of sand. The marginal revolution overturned the classical basis for Marx’s conclusions." loading="lazy">
      <figcaption><a href="#slide-34">34</a></figcaption>
    </figure>
  </main>
