  <main>
    <figure id="slide-1">
      <img src="MiddleAges/slide-01.jpg" width="1200" height="900" alt="Economic Life Before the Great Transformation">
      <figcaption><a href="#slide-1">1</a></figcaption>
    </figure>
    <figure id="slide-2">
      <img src="MiddleAges/slide-02.jpg" width="1200" height="900" alt="Medieval Society. Medieval society was seen as consisting of three classes: Knights – those who fought. Clerics – those who prayed. Peasants – those who worked" loading="lazy">
      <figcaption><a href="#slide-2">2</a></figcaption>
    </figure>
    <figure id="slide-3">
      <img src="MiddleAges/slide-03.jpg" width="1200" height="900" alt="The Feudal System" loading="lazy">
      <figcaption><a href="#slide-3">3</a></figcaption>
    </figure>
    <figure id="slide-4">
      <img src="MiddleAges/slide-04.jpg" width="1200" height="900" alt="Feudalism. Nobles pledged oaths of loyalty and service. The king was merely the top noble in a chain of such pledges. Political allegiance was personal" loading="lazy">
      <figcaption><a href="#slide-4">4</a></figcaption>
    </figure>
    <figure id="slide-5">
      <img src="MiddleAges/slide-05.jpg" width="1200" height="900" alt="Feudalism. The Magna Carta, an early sort of constitution, was an agreement between King John and his feudal barons" loading="lazy">
      <figcaption><a href="#slide-5">5</a></figcaption>
    </figure>
    <figure id="slide-6">
      <img src="MiddleAges/slide-06.jpg" width="1200" height="900" alt="The Guild System. Productive activities were organized by the producers. They regulated prices, hours, ingredients, and manufacturing processes. The guild provided social insurance and welfare services for members. The coat of arms of the worshipful society of drapers" loading="lazy">
      <figcaption><a href="#slide-6">6</a></figcaption>
    </figure>
    <figure id="slide-7">
      <img src="MiddleAges/slide-07.jpg" width="1200" height="900" alt="Guilds. Examples: Clothmakers. Brewers. Bakers. Stonemasons. Shipbuilders. Butchers. Barbers. To the left is the guild sign of the glaziers guild" loading="lazy">
      <figcaption><a href="#slide-7">7</a></figcaption>
    </figure>
    <figure id="slide-8">
      <img src="MiddleAges/slide-08.jpg" width="1200" height="900" alt="Guilds. Some guild signs survive to this day, such as the barber shop pole. Other modern remnants of the guild system include medical associations, the legal bar, and academic qualifications" loading="lazy">
      <figcaption><a href="#slide-8">8</a></figcaption>
    </figure>
    <figure id="slide-9">
      <img src="MiddleAges/slide-09.jpg" width="1200" height="900" alt="Guilds. “Where guilds were in control they shaped labour, production and trade; they had strong controls over instructional capital, and the modern concepts of a lifetime progression of apprentice to craftsman, journeyman, and eventually to widely-recognized master and grandmaster began to emerge. In order to become a Master, a Journeyman would have to go on a 3 year voyage called Journeyman years.” -- Wikipedia" loading="lazy">
      <figcaption><a href="#slide-9">9</a></figcaption>
    </figure>
    <figure id="slide-10">
      <img src="MiddleAges/slide-10.jpg" width="1200" height="900" alt="The Manorial System. “Manorialism was characterised by the vesting of legal and economic power in a lord, supported economically from his own direct landholding and from the obligatory contributions of a legally subject part of the peasant population under his jurisdiction. These obligations could be payable in several ways, in labor… in kind, or, on rare occasions, in coin.” -- Wikipedia" loading="lazy">
      <figcaption><a href="#slide-10">10</a></figcaption>
    </figure>
    <figure id="slide-11">
      <img src="MiddleAges/slide-11.jpg" width="1200" height="900" alt="Serfdom. “Serfdom is the socio-economic status of unfree peasants under feudalism, and specifically relates to Manorialism. It was a condition of bondage or modified slavery which developed primarily during the High Middle Ages in Europe. Serfdom was the enforced labour of serfs on the fields of landowners, in return for protection and the right to work on their leased fields.” -- Wikipedia" loading="lazy">
      <figcaption><a href="#slide-11">11</a></figcaption>
    </figure>
    <figure id="slide-12">
      <img src="MiddleAges/slide-12.jpg" width="1200" height="900" alt="Serfdom. “Serfdom involved not only work in fields, but also various other activities, like forestry, mining, transportation (both land and river-based), and crafts. Manors formed the basic unit of society during this period, and the lord and his serfs were bound legally, economically, and socially. Serfs were labourers who were bound to the land...” -- Wikipedia" loading="lazy">
      <figcaption><a href="#slide-12">12</a></figcaption>
    </figure>
    <figure id="slide-13">
      <img src="MiddleAges/slide-13.jpg" width="1200" height="900" alt="The Manor. The land of the manor was divided among different uses: Common pasture. Meadow. Woodland. Water. Planted fields" loading="lazy">
      <figcaption><a href="#slide-13">13</a></figcaption>
    </figure>
    <figure id="slide-14">
      <img src="MiddleAges/slide-14.jpg" width="1200" height="900" alt="Medieval Cities" loading="lazy">
      <figcaption><a href="#slide-14">14</a></figcaption>
    </figure>
    <figure id="slide-15">
      <img src="MiddleAges/slide-15.jpg" width="1200" height="900" alt="Medieval Cities. Centers of commerce. Rise of a middle class. Used by kings as a counterweight to the nobility. After a year and a day, a serf who escaped to the city was free: “city are makes one free”" loading="lazy">
      <figcaption><a href="#slide-15">15</a></figcaption>
    </figure>
    <figure id="slide-16">
      <img src="MiddleAges/slide-16.jpg" width="1200" height="900" alt="Rise of a Merchant Class in the High Middle Ages. Merchants were a strange class -- always wandering, most often they had non-free parents. Merchants were outside the manorial system, circulating everywhere without being claimed by anyone. Merchants required new, simpler legal code than the one that was suitable to manorial life. City life depends on commerce- visa-versa. Cities and specialization division of labor. Merchants need a fixed place for slow times and to trade information and banking." loading="lazy">
      <figcaption><a href="#slide-16">16</a></figcaption>
    </figure>
