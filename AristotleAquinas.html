<body>
  <header>
    <p class="home"><a href="index.html">&larr; The Great Transformation</a></p>
    <h1>Aristotle and Aquinas</h1>
    <p><a href="AristotleAquinas.pdf">Download PDF</a> &middot; 14 slides</p>
  </header>
  <main>
    <figure id="slide-1">
      <img src="AristotleAquinas/slide-01.jpg" width="1200" height="900" alt="Aristotle and Aquinas. The foundations of Medieval Economic. Thought">
      <figcaption><a href="#slide-1">1</a></figcaption>
    </figure>
    <figure id="slide-2">
      <img src="AristotleAquinas/slide-02.jpg" width="1200" height="900" alt="Aristotle. 384-322 BCE. Greek. Student of Plato. Teacher of Alexander the Great" loading="lazy">
      <figcaption><a href="#slide-2">2</a></figcaption>
    </figure>
    <figure id="slide-3">
      <img src="AristotleAquinas/slide-03.jpg" width="1200" height="900" alt="Aristotle. In physical science, Aristotle studied anatomy, astronomy, embryology, geography, geology, meteorology, physics and zoology. In philosophy, he wrote on aesthetics, ethics, government, metaphysics, politics, economics, psychology, rhetoric and theology. He also studied education, foreign customs, literature and poetry. Source: Wikipedia" loading="lazy">
      <figcaption><a href="#slide-3">3</a></figcaption>
    </figure>
    <figure id="slide-4">
      <img src="AristotleAquinas/slide-04.jpg" width="1200" height="900" alt="Aristotle: Teleology. Things seek to achieve their natural end or telos. What is good for something is to achieve that end" loading="lazy">
      <figcaption><a href="#slide-4">4</a></figcaption>
    </figure>
    <figure id="slide-5">
      <img src="AristotleAquinas/slide-05.jpg" width="1200" height="900" alt="Aristotle on trade. Trade for Aristotle is instrumental. A means to achieving the good life" loading="lazy">
      <figcaption><a href="#slide-5">5</a></figcaption>
    </figure>
    <figure id="slide-6">
      <img src="AristotleAquinas/slide-06.jpg" width="1200" height="900" alt="Wealth. Provides the material for household management: oecomonmica" loading="lazy">
      <figcaption><a href="#slide-6">6</a></figcaption>
    </figure>
    <figure id="slide-7">
      <img src="AristotleAquinas/slide-07.jpg" width="1200" height="900" alt="Acquisition. Natural limit: acquire enough to live an unstressed, healthy life." loading="lazy">
      <figcaption><a href="#slide-7">7</a></figcaption>
    </figure>
    <figure id="slide-8">
      <img src="AristotleAquinas/slide-08.jpg" width="1200" height="900" alt="Proper and improper use. Shoe: Proper use of a shoe is to protect feet. Improper use: Hammer nails. Something is used properly when use is in line with its end." loading="lazy">
      <figcaption><a href="#slide-8">8</a></figcaption>
    </figure>
    <figure id="slide-9">
      <img src="AristotleAquinas/slide-09.jpg" width="1200" height="900" alt="Exchange. To satisfy a person’s natural wants is natural. Bread and wine" loading="lazy">
      <figcaption><a href="#slide-9">9</a></figcaption>
    </figure>
    <figure id="slide-10">
      <img src="AristotleAquinas/slide-10.jpg" width="1200" height="900" alt="Midas. How can money be wealth when Midas could starve despite having so much of it? Moral: unlimited acquisition of wealth is unnatural" loading="lazy">
      <figcaption><a href="#slide-10">10</a></figcaption>
    </figure>
    <figure id="slide-11">
      <img src="AristotleAquinas/slide-11.jpg" width="1200" height="900" alt="Aristotle on Virtue. Aristotle’s idea of the mean – virtue is the mean between two vices. Courage lies between cowardice and rashness. Temperance is the mean of drunkenness and teetotaling" loading="lazy">
      <figcaption><a href="#slide-11">11</a></figcaption>
    </figure>
    <figure id="slide-12">
      <img src="AristotleAquinas/slide-12.jpg" width="1200" height="900" alt="Aquinas. 1225 – 1274 CE. Born in central Italy. Set Aristotle in a Christian context" loading="lazy">
      <figcaption><a href="#slide-12">12</a></figcaption>
    </figure>
    <figure id="slide-13">
      <img src="AristotleAquinas/slide-13.jpg" width="1200" height="900" alt="Aquinas on Usury. Aquinas held that usury is selling what is non-existent. Paying back the loan is payment for the loan. The interest is payment for nothing" loading="lazy">
      <figcaption><a href="#slide-13">13</a></figcaption>
    </figure>
    <figure id="slide-14">
      <img src="AristotleAquinas/slide-14.jpg" width="1200" height="900" alt="Aquinas on Usury. Aquinas holds that one can borrow at interest: If one did not persuade the usurer (he was out loaning money anyway); If the loan is put to good use." loading="lazy">
      <figcaption><a href="#slide-14">14</a></figcaption>
    </figure>
  </main>
